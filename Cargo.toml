[package]
name = "rdpi"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
description = "Rust Deep Packet Inspection library"
license = "MIT"
repository = "https://github.com/yourname/rdpi"
keywords = ["dpi", "packet", "network", "protocol", "detection"]

[dependencies]
thiserror = "1.0"
aho-corasick = "1.1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
pcap-file = { version = "2.0", optional = true }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
libloading = { version = "0.8", optional = true }

[features]
default = ["dns", "http", "tls"]
dns = []
http = []
tls = []
ssh = []
smtp = []
quic = []
dtls = []
mail = []
infra = []
snmp = []
modbus = []
database = []
messaging = []  # AMQP
pcap = ["dep:pcap-file"]
rule = ["serde", "serde_json"]
json = ["serde", "serde_json"]  # CLI/库 JSON 序列化输出
proto3 = []    # FTP, SIP, RTP/RTCP
iot = []       # MQTT
vpn = []       # WireGuard, OpenVPN
voip = []      # STUN
auth = []      # Kerberos, LDAP
remote = []    # RDP
risk = ["serde", "serde_json"]
storage = []   # NFS
smb = []       # SMBv1/v2/v3 + NetBIOS
misc = []      # TFTP, Rsync, Whois, Syslog, Telnet, VNC（R7：纳入 feature 矩阵）
live = ["dep:libloading"]  # 实时抓包适配层（动态加载 Npcap/libpcap）

[dev-dependencies]
pcap-file = "2.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "rdpi"
required-features = ["pcap"]

[[bench]]
name = "bench_detect"
harness = false
